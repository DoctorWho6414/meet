<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>До встречи Сонички и Алеженьки</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Manrope', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;

    background:
    radial-gradient(circle at top left, #7de4ff 0%, transparent 30%),
    radial-gradient(circle at top right, #ffb3ff 0%, transparent 30%),
    linear-gradient(180deg, #2db8ff 0%, #0077cc 40%, #003c74 100%);
}

/* Радуга */
.rainbow {
    position: absolute;
    top: -10%;
    width: 120vw;
    height: 60vw;
    border-radius: 50%;
    border: 18px solid transparent;
    border-top-color: #ff5e5e;
    box-shadow:
        0 -18px 0 #ff9f43,
        0 -36px 0 #ffe66d,
        0 -54px 0 #4cd137,
        0 -72px 0 #00d2d3,
        0 -90px 0 #54a0ff,
        0 -108px 0 #c56cf0;
    opacity: 0.6;
}

/* Дельфины */
.dolphin {
    position: absolute;
    font-size: 70px;
    opacity: 0.7;
    animation: float 6s ease-in-out infinite;
}

.d1 { top: 15%; left: 15%; }
.d2 { top: 10%; right: 20%; animation-delay: 2s; }
.d3 { bottom: 20%; right: 15%; animation-delay: 4s; }

@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-8deg); }
    50% { transform: translateY(-20px) rotate(8deg); }
}

/* Блёстки */
.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 15px white;
    animation: twinkle 2s infinite;
}

@keyframes twinkle {
    50% {
        opacity: 0.2;
        transform: scale(0.5);
    }
}

/* Цветочки */
.flower {
    position: absolute;
    font-size: 30px;
    animation: float 5s infinite ease-in-out;
}

/* Основной контейнер */
.container {
    position: relative;
    z-index: 10;
    width: min(92%, 800px);
    backdrop-filter: blur(18px);
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 32px;
    padding: 40px 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}

h1 {
    font-size: clamp(1.6rem, 4.5vw, 3rem);
    line-height: 1.3;
    margin-bottom: 35px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
}

/* Новая единая панель таймера */
.timer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 20px 10px;
    box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
}

.block {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

/* Вертикальные разделители между цифрами */
.block:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0;
    top: 15%;
    height: 70%;
    width: 1px;
    background: rgba(255, 255, 255, 0.25);
}

.number {
    font-size: clamp(1.8rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1.1;
    text-shadow: 0 4px 15px rgba(255, 255, 255, 0.4);
}

.label {
    margin-top: 6px;
    font-size: clamp(0.6rem, 2vw, 0.9rem);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
}

/* Для совсем крошечных экранов */
@media(max-width: 400px) {
    .timer { padding: 15px 5px; }
    h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>

<div class="rainbow"></div>

<div class="dolphin d1">🐬</div>
<div class="dolphin d2">🐬</div>
<div class="dolphin d3">🐬</div>

<div class="flower" style="left:10%;top:70%">🌸</div>
<div class="flower" style="left:80%;top:75%">🌺</div>
<div class="flower" style="left:85%;top:20%">🌼</div>

<div class="sparkle" style="top:20%;left:25%"></div>
<div class="sparkle" style="top:30%;left:70%"></div>
<div class="sparkle" style="top:75%;left:15%"></div>
<div class="sparkle" style="top:65%;left:80%"></div>
<div class="sparkle" style="top:50%;left:50%"></div>

<div class="container">
    <h1>💖 До встречи<br>Сонечки и Алеженьки 💖</h1>

    <div class="timer">
        <div class="block">
            <div class="number" id="days">0</div>
            <div class="label">Дней</div>
        </div>

        <div class="block">
            <div class="number" id="hours">0</div>
            <div class="label">Часов</div>
        </div>

        <div class="block">
            <div class="number" id="minutes">0</div>
            <div class="label">Минут</div>
        </div>

        <div class="block">
            <div class="number" id="seconds">0</div>
            <div class="label">Секунд</div>
        </div>
    </div>
</div>

<script>
// УКАЖИ СВОЮ ДАТУ
const targetDate = new Date("2026-06-12T00:10:00");

function updateTimer(){
    const now = new Date();
    const diff = targetDate - now;

    if(diff <= 0){
        document.querySelector(".container").innerHTML =
        "<h1>💖 Вы встретились! 💖</h1>";
        return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff/(1000*60*60)) % 24);
    const minutes = Math.floor((diff/(1000*60)) % 60);
    const seconds = Math.floor((diff/1000) % 60);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateTimer();
setInterval(updateTimer,1000);
</script>

</body>
</html>
